events { worker_connections 1024; }

http {
  upstream backend  { server backend:8000; }
  upstream frontend { server frontend:3000; }

  server {
    listen 80;
    client_max_body_size 10m;

    # External webhooks (Telnyx SMS, VAPI voice, Cal.com bookings, n8n callbacks)
    # must reach the backend directly — they are not UI traffic.
    location /webhooks/ {
      proxy_pass http://backend/webhooks/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
    }

    # Direct backend health probe.
    location = /health {
      proxy_pass http://backend/health;
    }

    # Everything else -> Next.js. The frontend's own /api/proxy route forwards
    # UI API calls to the backend (BACKEND_URL), including SSE streaming for
    # /chat — so buffering must stay off on this location.
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      chunked_transfer_encoding on;
    }
  }
}
