version: "3.9"

services:
  # ── API server (ROLE=web) ─────────────────────────────────────────────────
  # HA note: the app is split into roles. `backend` serves the API only; the
  # `worker` and `scheduler` services below run the background work. Scale
  # `worker` to N replicas freely (Redis blpop is N-safe); run 1+ `scheduler`
  # replicas — run_once locks ensure each scheduled unit fires exactly once
  # cluster-wide, with automatic failover if one dies.
  # To run everything in ONE container instead, drop worker+scheduler and set
  # this service's ROLE=all (the historical single-node mode).
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: automiqo-backend:local
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - ROLE=web
      - REDIS_URL=redis://redis:6379
      - N8N_WEBHOOK_BASE_URL=http://n8n:5678/webhook
    volumes:
      - ../backend:/app/backend
      - ../agents:/app/agents
      - ../shared:/app/shared
      - ../prompts:/app/prompts
      - ../specialist_library:/app/specialist_library
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode()==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Task/event workers (ROLE=worker) — scale to N replicas safely ─────────
  worker:
    image: automiqo-backend:local
    # Same image/entrypoint as backend; main.py's lifespan reads ROLE and starts
    # only the worker loops here (the uvicorn server runs but takes no traffic —
    # no port is published).
    env_file:
      - ../.env
    environment:
      - ROLE=worker
      - REDIS_URL=redis://redis:6379
      - N8N_WEBHOOK_BASE_URL=http://n8n:5678/webhook
    volumes:
      - ../backend:/app/backend
      - ../agents:/app/agents
      - ../shared:/app/shared
      - ../prompts:/app/prompts
      - ../specialist_library:/app/specialist_library
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  # ── Autonomous + manager scheduler (ROLE=scheduler) ───────────────────────
  scheduler:
    image: automiqo-backend:local
    # Same image/entrypoint as backend; main.py's lifespan reads ROLE and starts
    # only the autonomous + manager schedulers here. Run 1+ replicas — run_once
    # locks make each scheduled unit fire exactly once cluster-wide.
    env_file:
      - ../.env
    environment:
      - ROLE=scheduler
      - REDIS_URL=redis://redis:6379
      - N8N_WEBHOOK_BASE_URL=http://n8n:5678/webhook
    volumes:
      - ../backend:/app/backend
      - ../agents:/app/agents
      - ../shared:/app/shared
      - ../prompts:/app/prompts
      - ../specialist_library:/app/specialist_library
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      # Server-side proxy target — MUST be the backend service name, not localhost.
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Persist the queue to disk (AOF) so a Redis restart doesn't drop in-flight
    # tasks. The Supabase `tasks` table remains the durable source of truth
    # (recover_pending_tasks re-hydrates on boot), but AOF avoids the gap.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/New_York
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n:/home/node/workflows
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  n8n_data:
  redis_data:
